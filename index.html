<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Milky Way AR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #e8eef8;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #c {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block;
      touch-action: none;
    }
    #ui {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 20;
      padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      background: linear-gradient(transparent, rgba(0,0,8,0.75));
      pointer-events: none;
    }
    #ui button {
      pointer-events: auto;
      appearance: none;
      border: 1px solid rgba(160,190,255,0.35);
      background: rgba(12,18,36,0.82);
      color: #e8eef8;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #ui button:active { transform: scale(0.97); }
    #ui button:disabled { opacity: 0.45; }
    #ui button.on {
      background: rgba(70,110,220,0.55);
      border-color: rgba(180,210,255,0.7);
    }
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
      background: linear-gradient(rgba(0,0,8,0.7), transparent);
      pointer-events: none;
    }
    #status {
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.92;
      text-shadow: 0 1px 3px #000;
      max-width: 42rem;
    }
    #hint { margin-top: 4px; font-size: 12px; opacity: 0.7; }
    #permOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0,0,10,0.88);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      padding: 24px;
      text-align: center;
    }
    #permOverlay.show { display: flex; }
    #permOverlay p { max-width: 22rem; font-size: 15px; line-height: 1.45; opacity: 0.9; }
    #permOverlay button {
      appearance: none;
      border: 1px solid rgba(160,190,255,0.45);
      background: rgba(50,90,200,0.75);
      color: #fff;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="status">Loading Milky Way…</div>
    <div id="hint"></div>
  </div>
  <div id="ui">
    <button type="button" id="btnAR" disabled>Start AR</button>
    <button type="button" id="btnRecenter">Recenter</button>
    <button type="button" id="btnLabels" class="on">Labels</button>
    <button type="button" id="btnOrient" style="display:none">Enable motion</button>
  </div>
  <div id="permOverlay">
    <p>Allow motion sensors so the galaxy can stay fixed on the floor as you turn your phone.</p>
    <button type="button" id="btnPerm">Allow motion access</button>
  </div>

  <script type="module">
import * as THREE from 'three';

// Scale: galaxy ~1 m across, disc ~30 kpc → 1 kpc = 1/30 m
const GALAXY_DIAMETER_M = 1.0;
const DISC_KPC = 30;
const M_PER_KPC = GALAXY_DIAMETER_M / DISC_KPC;
const SUN_R_KPC = 8.2;
const PLACE_DISTANCE_M = 0.5;

const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const btnAR = document.getElementById('btnAR');
const btnRecenter = document.getElementById('btnRecenter');
const btnLabels = document.getElementById('btnLabels');
const btnOrient = document.getElementById('btnOrient');
const permOverlay = document.getElementById('permOverlay');
const btnPerm = document.getElementById('btnPerm');
const canvas = document.getElementById('c');

function setStatus(msg, hint = '') {
  statusEl.textContent = msg;
  hintEl.textContent = hint;
}

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.xr.enabled = true;
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000008, 0.28);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.01, 40);
camera.position.set(0, 1.4, 0.8);

scene.add(new THREE.AmbientLight(0x6688aa, 0.55));
const key = new THREE.DirectionalLight(0xffe8cc, 0.35);
key.position.set(1, 2, 1);
scene.add(key);

const galaxyRoot = new THREE.Group();
scene.add(galaxyRoot);
const labelsRoot = new THREE.Group();
galaxyRoot.add(labelsRoot);

function mulberry32(a) {
  return function () {
    let t = (a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function createParticleTexture() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,240,220,0.85)');
  g.addColorStop(0.55, 'rgba(180,200,255,0.25)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const particleTex = createParticleTexture();

const ARMS = [
  { name: 'Perseus', a0: 3.2, pitchDeg: 12.2, phase: 0.35, color: [0.55, 0.72, 1.0], weight: 1.15 },
  { name: 'Scutum–Centaurus', a0: 2.7, pitchDeg: 12.0, phase: 0.35 + Math.PI / 2, color: [0.75, 0.85, 1.0], weight: 1.05 },
  { name: 'Sagittarius', a0: 2.9, pitchDeg: 11.8, phase: 0.35 + Math.PI, color: [1.0, 0.78, 0.55], weight: 1.0 },
  { name: 'Norma / Outer', a0: 3.4, pitchDeg: 12.5, phase: 0.35 + 1.5 * Math.PI, color: [0.65, 0.78, 1.0], weight: 0.9 },
];

function armRadius(arm, theta) {
  const b = Math.tan((arm.pitchDeg * Math.PI) / 180);
  return arm.a0 * Math.exp(b * (theta - arm.phase));
}

function addStars(positions, colors, sizes, n, rng, sampler) {
  for (let i = 0; i < n; i++) {
    const s = sampler(rng, i);
    positions.push(s.x * M_PER_KPC, s.y * M_PER_KPC, s.z * M_PER_KPC);
    colors.push(s.r, s.g, s.b);
    sizes.push(s.size);
  }
}

function buildGalaxy() {
  const positions = [];
  const colors = [];
  const sizes = [];
  const rng = mulberry32(0x4d494c4b);

  // Bulge
  addStars(positions, colors, sizes, 9000, rng, (rng) => {
    const u = rng(), v = rng(), w = rng();
    const rad = 1.8 * Math.pow(u, 0.55);
    const theta = 2 * Math.PI * v;
    const phi = Math.acos(2 * w - 1);
    const x = rad * Math.sin(phi) * Math.cos(theta);
    const y = rad * Math.cos(phi) * 0.45;
    const z = rad * Math.sin(phi) * Math.sin(theta);
    const t = Math.min(1, Math.hypot(x, z) / 2.2);
    return {
      x, y, z,
      r: 1.0, g: 0.78 - 0.15 * t, b: 0.45 - 0.2 * t,
      size: 0.012 + rng() * 0.02,
    };
  });

  // Central bar
  addStars(positions, colors, sizes, 5500, rng, (rng) => {
    const along = (rng() - 0.5) * 9.0;
    const width = (rng() - 0.5) * (1.1 + 0.15 * Math.abs(along));
    const height = (rng() - 0.5) * 0.55;
    const ang = 0.4;
    const x = along * Math.cos(ang) - width * Math.sin(ang);
    const z = along * Math.sin(ang) + width * Math.cos(ang);
    return {
      x, y: height, z,
      r: 1.0, g: 0.72 + rng() * 0.1, b: 0.42 + rng() * 0.12,
      size: 0.01 + rng() * 0.018,
    };
  });

  // Four main log-spiral arms
  for (const arm of ARMS) {
    const count = Math.floor(14000 * arm.weight);
    addStars(positions, colors, sizes, count, rng, (rng) => {
      let theta = arm.phase + rng() * 4.2 * Math.PI;
      let r = armRadius(arm, theta);
      for (let tries = 0; tries < 6 && (r < 2.2 || r > 14.5); tries++) {
        theta = arm.phase + rng() * 4.5 * Math.PI;
        r = armRadius(arm, theta);
      }
      r = Math.min(14.8, Math.max(2.0, r));
      const w = (0.35 + 0.045 * r) * (rng() - 0.5) * 2;
      const h = (0.08 + 0.012 * r) * (rng() - 0.5) * 2;
      const x = (r + w * 0.15) * Math.cos(theta) - w * Math.sin(theta);
      const z = (r + w * 0.15) * Math.sin(theta) + w * Math.cos(theta);
      const young = rng();
      let cr = arm.color[0], cg = arm.color[1], cb = arm.color[2];
      if (young > 0.82) { cr = 0.7; cg = 0.85; cb = 1.0; }
      else if (young < 0.12) { cr = 1.0; cg = 0.55; cb = 0.35; }
      const bright = 0.65 + rng() * 0.35;
      return {
        x, y: h, z,
        r: cr * bright, g: cg * bright, b: cb * bright,
        size: 0.008 + rng() * 0.022 + (young > 0.9 ? 0.015 : 0),
      };
    });
  }

  // Orion Spur (local arm between Sagittarius & Perseus)
  addStars(positions, colors, sizes, 3500, rng, (rng) => {
    const r = 7.2 + rng() * 2.2;
    const baseTheta = 0.15 + (r - 7.2) * 0.08;
    const theta = baseTheta + (rng() - 0.5) * 0.85;
    const w = (rng() - 0.5) * 0.9;
    const h = (rng() - 0.5) * 0.22;
    const x = r * Math.cos(theta) + w * Math.cos(theta + Math.PI / 2);
    const z = r * Math.sin(theta) + w * Math.sin(theta + Math.PI / 2);
    return {
      x, y: h, z,
      r: 0.85 + rng() * 0.15, g: 0.9 + rng() * 0.08, b: 1.0,
      size: 0.009 + rng() * 0.02,
    };
  });

  // Field / thin disc
  addStars(positions, colors, sizes, 12000, rng, (rng) => {
    const r = 1.5 + 13.5 * Math.sqrt(rng());
    const theta = 2 * Math.PI * rng();
    const h = (rng() - 0.5) * (0.25 + 0.02 * r);
    return {
      x: r * Math.cos(theta), y: h, z: r * Math.sin(theta),
      r: 0.75 + rng() * 0.25, g: 0.8 + rng() * 0.15, b: 0.95,
      size: 0.005 + rng() * 0.012,
    };
  });

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      pointTexture: { value: particleTex },
      uOpacity: { value: 0.95 },
    },
    vertexShader: `
      attribute float aSize;
      attribute vec3 color;
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        vColor = color;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        float dist = max(0.05, -mvPosition.z);
        gl_PointSize = aSize * (280.0 / dist);
        gl_PointSize = clamp(gl_PointSize, 1.0, 48.0);
        vAlpha = smoothstep(48.0, 8.0, gl_PointSize);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      uniform sampler2D pointTexture;
      uniform float uOpacity;
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        vec4 tex = texture2D(pointTexture, gl_PointCoord);
        if (tex.a < 0.04) discard;
        gl_FragColor = vec4(vColor, tex.a * uOpacity * (0.55 + 0.45 * vAlpha));
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  galaxyRoot.add(points);

  const disc = new THREE.Mesh(
    new THREE.RingGeometry(0.02, GALAXY_DIAMETER_M * 0.52, 64),
    new THREE.MeshBasicMaterial({
      color: 0x334466,
      transparent: true,
      opacity: 0.12,
      side: THREE.DoubleSide,
      depthWrite: false,
    })
  );
  disc.rotation.x = -Math.PI / 2;
  galaxyRoot.add(disc);

  return { count: positions.length / 3 };
}

const { count: starCount } = buildGalaxy();

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function makeLabel(text, color = '#ffe9a8') {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const pad = 10;
  ctx.font = '600 28px system-ui, sans-serif';
  const w = Math.ceil(ctx.measureText(text).width) + pad * 2;
  const h = 44;
  c.width = w * 2;
  c.height = h * 2;
  ctx.scale(2, 2);
  ctx.font = '600 28px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(0,0,12,0.55)';
  roundRect(ctx, 0, 0, w, h, 10);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, pad, h / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const spr = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false })
  );
  spr.scale.set(w / 500, h / 500, 1);
  return spr;
}

const sunTheta = 0.22;
const sunX = SUN_R_KPC * Math.cos(sunTheta) * M_PER_KPC;
const sunZ = SUN_R_KPC * Math.sin(sunTheta) * M_PER_KPC;

const sunGroup = new THREE.Group();
sunGroup.position.set(sunX, 0.012, sunZ);
galaxyRoot.add(sunGroup);

sunGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(0.008, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffe566 })
));
const sunGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.018, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.35, depthWrite: false })
);
sunGroup.add(sunGlow);
const sunRing = new THREE.Mesh(
  new THREE.RingGeometry(0.022, 0.028, 32),
  new THREE.MeshBasicMaterial({ color: 0xffe8a0, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false })
);
sunRing.rotation.x = -Math.PI / 2;
sunGroup.add(sunRing);

const sunLabel = makeLabel('Sun · Orion Spur · 8.2 kpc', '#ffe9a8');
sunLabel.position.copy(sunGroup.position).add(new THREE.Vector3(0, 0.045, 0));
labelsRoot.add(sunLabel);

galaxyRoot.add(new THREE.Mesh(
  new THREE.SphereGeometry(0.01, 12, 12),
  new THREE.MeshBasicMaterial({ color: 0xff8866 })
));
const centreLabel = makeLabel('Galactic centre', '#ffb0a0');
centreLabel.position.set(0, 0.05, 0);
labelsRoot.add(centreLabel);

const armLabels = [
  { name: 'Perseus Arm', arm: ARMS[0], t: 2.2 },
  { name: 'Scutum–Centaurus', arm: ARMS[1], t: 2.0 },
  { name: 'Sagittarius Arm', arm: ARMS[2], t: 2.1 },
  { name: 'Norma / Outer', arm: ARMS[3], t: 2.4 },
];
for (const L of armLabels) {
  const theta = L.arm.phase + L.t * Math.PI;
  let r = Math.min(12.5, Math.max(4, armRadius(L.arm, theta)));
  const spr = makeLabel(L.name, '#cfe0ff');
  spr.position.set(r * Math.cos(theta) * M_PER_KPC, 0.035, r * Math.sin(theta) * M_PER_KPC);
  labelsRoot.add(spr);
}
const orionLabel = makeLabel('Orion Spur', '#d0f0ff');
orionLabel.position.set(7.8 * Math.cos(0.18) * M_PER_KPC, 0.03, 7.8 * Math.sin(0.18) * M_PER_KPC);
labelsRoot.add(orionLabel);

let labelsVisible = true;

function placeGalaxyInFront(viewerPos, viewerQuat) {
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(viewerQuat);
  forward.y = 0;
  if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
  forward.normalize();
  const pos = viewerPos.clone().addScaledVector(forward, PLACE_DISTANCE_M);
  pos.y = 0;
  galaxyRoot.position.copy(pos);
  galaxyRoot.rotation.set(0, 0, 0);
  galaxyRoot.visible = true;
}

function placeFallbackDefault() {
  galaxyRoot.position.set(0, 0, -PLACE_DISTANCE_M);
  galaxyRoot.rotation.set(0, 0, 0);
  galaxyRoot.visible = true;
  camera.position.set(0, 1.35, 0);
  camera.lookAt(0, 0.05, -PLACE_DISTANCE_M);
}

// ----- Fallback: DeviceOrientation + touch -----
let mode = 'fallback';
let orientEnabled = false;
let deviceAlpha = 0, deviceBeta = 0, deviceGamma = 0;
let orientBase = null;
let touchDragging = false;
let touchLastX = 0, touchLastY = 0;
let manualYaw = 0, manualPitch = -0.35;

const needsOrientPermission =
  typeof DeviceOrientationEvent !== 'undefined' &&
  typeof DeviceOrientationEvent.requestPermission === 'function';

function onDeviceOrientation(e) {
  if (e.alpha == null || e.beta == null || e.gamma == null) return;
  deviceAlpha = e.alpha;
  deviceBeta = e.beta;
  deviceGamma = e.gamma;
  if (!orientBase) orientBase = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
  orientEnabled = true;
}

function enableOrientation() {
  return new Promise(async (resolve) => {
    if (needsOrientPermission) {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res !== 'granted') { resolve(false); return; }
      } catch {
        resolve(false); return;
      }
    }
    orientBase = null;
    window.addEventListener('deviceorientation', onDeviceOrientation, true);
    resolve(true);
  });
}

const _euler = new THREE.Euler();
const _q = new THREE.Quaternion();
const _zee = new THREE.Vector3(0, 0, 1);
const _q0 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
const _qScreen = new THREE.Quaternion();

function updateFallbackCamera() {
  if (mode !== 'fallback') return;

  if (orientEnabled && orientBase) {
    const alpha = THREE.MathUtils.degToRad(deviceAlpha - orientBase.alpha);
    const beta = THREE.MathUtils.degToRad(deviceBeta);
    const gamma = THREE.MathUtils.degToRad(deviceGamma);
    const orientAngle = (typeof window.orientation === 'number'
      ? window.orientation
      : (screen.orientation?.angle || 0));
    _qScreen.setFromAxisAngle(_zee, -THREE.MathUtils.degToRad(orientAngle));
    _euler.set(beta, alpha, -gamma, 'YXZ');
    _q.setFromEuler(_euler);
    _q.multiply(_q0);
    _q.multiply(_qScreen);

    const eyeLocal = new THREE.Vector3(0, 1.35, PLACE_DISTANCE_M);
    eyeLocal.applyQuaternion(_q);
    camera.position.copy(galaxyRoot.position).add(eyeLocal);
    camera.quaternion.copy(_q);
  } else {
    const r = 1.55;
    const yaw = manualYaw;
    const pitch = THREE.MathUtils.clamp(manualPitch, -1.2, 0.2);
    const x = Math.sin(yaw) * Math.cos(pitch) * r;
    const y = 0.55 - Math.sin(pitch) * r * 0.55;
    const z = Math.cos(yaw) * Math.cos(pitch) * r;
    camera.position.set(
      galaxyRoot.position.x + x,
      Math.max(0.15, galaxyRoot.position.y + y),
      galaxyRoot.position.z + z
    );
    camera.lookAt(galaxyRoot.position.x, 0.05, galaxyRoot.position.z);
  }
}

canvas.addEventListener('pointerdown', (e) => {
  if (mode !== 'fallback') return;
  touchDragging = true;
  touchLastX = e.clientX;
  touchLastY = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', (e) => {
  if (!touchDragging || mode !== 'fallback') return;
  const dx = e.clientX - touchLastX;
  const dy = e.clientY - touchLastY;
  touchLastX = e.clientX;
  touchLastY = e.clientY;
  manualYaw -= dx * 0.005;
  manualPitch -= dy * 0.004;
});
canvas.addEventListener('pointerup', () => { touchDragging = false; });
canvas.addEventListener('pointercancel', () => { touchDragging = false; });

// ----- WebXR AR + hit-test -----
let xrSession = null;
let hitTestSource = null;
let hitTestSourceRequested = false;
let refSpace = null;
let placed = false;
let arSupported = false;

const reticle = (() => {
  const g = new THREE.RingGeometry(0.06, 0.08, 32);
  g.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(
    g,
    new THREE.MeshBasicMaterial({
      color: 0x88aaff,
      transparent: true,
      opacity: 0.85,
      side: THREE.DoubleSide,
      depthWrite: false,
    })
  );
  mesh.visible = false;
  scene.add(mesh);
  return mesh;
})();

async function checkAR() {
  if (!navigator.xr) return false;
  try {
    return await navigator.xr.isSessionSupported('immersive-ar');
  } catch {
    return false;
  }
}

function onSelectPlace() {
  if (mode !== 'ar') return;
  if (reticle.visible) {
    galaxyRoot.position.copy(reticle.position);
    const e = new THREE.Euler().setFromQuaternion(reticle.quaternion, 'YXZ');
    galaxyRoot.rotation.set(0, e.y, 0);
    galaxyRoot.visible = true;
    placed = true;
    reticle.visible = false;
    setStatus('Galaxy placed — walk around it', 'Recenter or tap again after Recenter to move.');
  } else {
    const cam = renderer.xr.getCamera();
    const pos = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    cam.getWorldPosition(pos);
    cam.getWorldQuaternion(quat);
    placeGalaxyInFront(pos, quat);
    galaxyRoot.position.y = 0;
    placed = true;
    setStatus('Galaxy placed (~0.5 m ahead)', 'Walk around · Recenter to move.');
  }
}

async function startAR() {
  if (!navigator.xr) {
    setStatus('WebXR not available', 'Using motion / touch fallback.');
    return;
  }
  let session = null;
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test', 'local-floor'],
      optionalFeatures: ['dom-overlay', 'light-estimation'],
      domOverlay: { root: document.body },
    });
  } catch (_) {
    try {
      session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['local-floor', 'dom-overlay'],
        domOverlay: { root: document.body },
      });
    } catch (err2) {
      setStatus('Could not start AR: ' + (err2.message || err2), 'Try Chrome on Android, or use the motion fallback.');
      return;
    }
  }

  xrSession = session;
  mode = 'ar';
  placed = false;
  hitTestSource = null;
  hitTestSourceRequested = false;
  renderer.setClearColor(0x000000, 0);
  galaxyRoot.visible = false;
  reticle.visible = false;

  await renderer.xr.setSession(session);
  try {
    refSpace = await session.requestReferenceSpace('local-floor');
  } catch (_) {
    refSpace = await session.requestReferenceSpace('local');
  }

  session.addEventListener('end', onSessionEnded);
  session.addEventListener('select', onSelectPlace);

  setStatus('AR active — point at the floor, then tap to place', 'Default without a hit: ~0.5 m ahead on the floor.');
  btnAR.textContent = 'Exit AR';
}

function onSessionEnded() {
  xrSession = null;
  hitTestSource = null;
  hitTestSourceRequested = false;
  mode = 'fallback';
  reticle.visible = false;
  renderer.setClearColor(0x000000, 1);
  placeFallbackDefault();
  btnAR.textContent = arSupported ? 'Start AR' : 'AR unavailable';
  setStatus('AR ended — motion / touch mode', fallbackHint());
}

btnAR.addEventListener('click', () => {
  if (xrSession) xrSession.end();
  else if (arSupported) startAR();
});

btnRecenter.addEventListener('click', () => {
  if (mode === 'ar' && xrSession) {
    placed = false;
    galaxyRoot.visible = false;
    reticle.visible = true;
    setStatus('Point at the floor, then tap to place', 'Or tap with no hit for ~0.5 m ahead.');
  } else {
    orientBase = null;
    manualYaw = 0;
    manualPitch = -0.35;
    placeFallbackDefault();
    setStatus('Recentered', fallbackHint());
  }
});

btnLabels.addEventListener('click', () => {
  labelsVisible = !labelsVisible;
  labelsRoot.visible = labelsVisible;
  btnLabels.classList.toggle('on', labelsVisible);
});

btnOrient.addEventListener('click', () => {
  permOverlay.classList.add('show');
});

btnPerm.addEventListener('click', async () => {
  const ok = await enableOrientation();
  permOverlay.classList.remove('show');
  if (ok) {
    btnOrient.style.display = 'none';
    setStatus('Motion enabled — turn your phone', 'Galaxy sits ~0.5 m away on the floor.');
  } else {
    setStatus('Motion permission denied', 'You can still drag with your finger.');
  }
});

function fallbackHint() {
  if (needsOrientPermission && !orientEnabled) {
    return 'Tap “Enable motion” for gyro view, or drag to orbit.';
  }
  if (orientEnabled) return 'Turn the phone — view follows orientation (no walk-tracking).';
  return 'Drag to orbit the galaxy.';
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
});

const clock = new THREE.Clock();

renderer.setAnimationLoop((time, frame) => {
  const t = clock.getElapsedTime();
  sunGlow.scale.setScalar(1 + 0.08 * Math.sin(t * 2.5));

  if (labelsVisible) {
    for (const c of labelsRoot.children) {
      c.quaternion.copy(camera.quaternion);
    }
  }

  if (mode === 'ar' && frame && xrSession) {
    if (!hitTestSourceRequested) {
      hitTestSourceRequested = true;
      xrSession.requestReferenceSpace('viewer').then((viewerRef) => {
        return xrSession.requestHitTestSource({ space: viewerRef });
      }).then((source) => {
        hitTestSource = source;
      }).catch(() => {
        hitTestSource = null;
      });
    }

    if (hitTestSource && refSpace && !placed) {
      const hits = frame.getHitTestResults(hitTestSource);
      if (hits.length) {
        const hitPose = hits[0].getPose(refSpace);
        if (hitPose) {
          reticle.visible = true;
          reticle.position.set(
            hitPose.transform.position.x,
            hitPose.transform.position.y,
            hitPose.transform.position.z
          );
          reticle.quaternion.set(
            hitPose.transform.orientation.x,
            hitPose.transform.orientation.y,
            hitPose.transform.orientation.z,
            hitPose.transform.orientation.w
          );
        }
      } else {
        reticle.visible = false;
      }
    }
  } else if (mode === 'fallback') {
    updateFallbackCamera();
  }

  renderer.render(scene, camera);
});

placeFallbackDefault();

(async function boot() {
  arSupported = await checkAR();
  btnAR.disabled = !arSupported;
  btnAR.textContent = arSupported ? 'Start AR' : 'AR unavailable';

  if (needsOrientPermission) {
    btnOrient.style.display = '';
  } else if (typeof DeviceOrientationEvent !== 'undefined') {
    window.addEventListener('deviceorientation', onDeviceOrientation, true);
  }

  setStatus(
    `Milky Way · ${starCount.toLocaleString()} stars · Sun at 8.2 kpc`,
    arSupported
      ? 'Start AR to place the centre on the floor (~0.5 m).'
      : fallbackHint()
  );
})();
  </script>
</body>
</html>
